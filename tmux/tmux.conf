# -----------------------------------------------------------------------------
# General Settings
# -----------------------------------------------------------------------------
# Prefix: Ctrl-g
unbind C-b
set -g prefix C-g
bind C-g send-prefix

# Faster command sequence response (removes ESC delay in Vim/Neovim)
set -s escape-time 10

# Pass focus events through to applications (e.g. Vim/Neovim autoread)
set -g focus-events on

# Enable mouse support
set -g mouse on

# Start window and pane numbering at 1, and renumber automatically
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Reload config file
bind r source-file -q -F "#{config_files}" \; display "Reloaded tmux config."

# -----------------------------------------------------------------------------
# Terminal, Colors, & Features (Modern Consolidated)
# -----------------------------------------------------------------------------
# Set internal tmux terminal
set -g default-terminal "tmux-256color"

# OSC 52 clipboard and application passthrough (OpenCode, Neovim, etc.)
set -s set-clipboard on
set -g allow-passthrough on
set -s extended-keys on

# Consolidated terminal features:
# - clipboard  : OSC 52 host clipboard forwarding
# - extkeys    : CSI u extended keys
# - RGB        : 24-bit TrueColor support
# - hyperlinks : OSC 8 clickable link support
set -as terminal-features "*:clipboard:extkeys:RGB:hyperlinks"

# Fallback Ms override for older tmux versions (< 3.2)
set -as terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'

# -----------------------------------------------------------------------------
# Navigation & Panes
# -----------------------------------------------------------------------------
# Open panes and windows in the current working directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane selection
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Window movement
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Resize panes (repeatable)
bind -r H resize-pane -L 15
bind -r J resize-pane -D 15
bind -r K resize-pane -U 15
bind -r L resize-pane -R 15

# -----------------------------------------------------------------------------
# Vi Copy Mode (Modern tmux 2.4+ syntax)
# -----------------------------------------------------------------------------
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# -----------------------------------------------------------------------------
# Styling & Status Bar
# -----------------------------------------------------------------------------
set -g status-style fg=white,bg=colour232
set -g window-status-style fg=colour242,bg=colour232,dim
set -g window-status-current-style fg=colour48,bg=colour232,bright

set -g pane-border-style fg=colour238,bg=default
set -g pane-active-border-style fg=colour48,bg=default
set -g message-style fg=colour48,bg=colour232,bright

set -g monitor-activity off
set -g visual-activity on
